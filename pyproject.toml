[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emm1typer"
version = "0.1.0"
description = "Emm1 lineage typing and quality control tool for Streptococcus pyogenes"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0"}
authors = [
    {name = "JA-Lacey"}
]
maintainers = [
    {name = "JA-Lacey"}
]
keywords = ["bioinformatics", "streptococcus", "pyogenes", "emm1", "typing", "mykrobe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/JA-Lacey/Emm1Typer"
Repository = "https://github.com/JA-Lacey/Emm1Typer"
Issues = "https://github.com/JA-Lacey/Emm1Typer/issues"

[project.scripts]
emm1typer = "emm1typer.cli:main"

[tool.setuptools]
packages = ["emm1typer"]
include-package-data = true

[tool.setuptools.package-data]
emm1typer = [
    "mykrobe/data/skeletons/*.ctx",
    "reference_data/*"
]